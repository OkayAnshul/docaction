org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

kotlin.code.style=official

android.useAndroidX=true
android.nonTransitiveRClass=true

# AGP 9 ships built-in Kotlin support, which rejects plugins that register Kotlin
# source sets directly. KSP (Room, Hilt) still does. This is the documented
# suppression: https://developer.android.com/r/tools/built-in-kotlin
# Revisit once KSP registers its output through android.sourceSets.
android.disallowKotlinSourceSets=false
